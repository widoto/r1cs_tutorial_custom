[package]
name = "did"
version = "0.3.0"
authors = ["arkworks contributors"]
edition = "2018"

[dependencies]
ark-ff = { version = "^0.3.0", default-features = false }
ark-ec = { version = "^0.3.0", default-features = false }
ark-ed-on-bls12-381 = { version = "^0.3.0", features = ["r1cs"] }
ark-bls12-381 = { version = "^0.3.0", default-features = false }
ark-std = { version = "^0.4.0", default-features = false }
ark-relations = { version = "^0.3.0", default-features = false  }

ark-r1cs-std = { version = "^0.3.0", default-features = false }
ark-snark = { version = "^0.3.0", default-features = false }
ark-serialize = { version = "^0.4.2", default-features = false }
ark-serialize-derive = "0.4" 
ark-crypto-primitives = { version = "^0.3.0", default-features = true, features = [ "r1cs" ] }
tracing = { version = "0.1", default-features = false, features = [ "attributes" ] }
tracing-subscriber = { version = "0.2" }
thiserror = "1.0.61"
ark-bn254 = "0.3.0"
ark-ed-on-bn254 = {version = "^0.3.0", features = [ "r1cs" ]}
ark-groth16 = "0.3.0"
arkworks-gadgets = "0.4.20"
derivative = { version = "2.0", features = ["use_core"] }
blake2 = { version = "0.9" }
digest = "0.9"
hex = "0.4.3"
lazy_static = "1.4.0"
serde_json = "1.0.108"
num-bigint = "0.4.0"
rand = "0.8.5"
secp256k1 = { version = "0.28", features = ["recovery"] }
sha3 = "0.10.8"